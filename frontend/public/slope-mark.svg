<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Slope</title>
  <defs>
    <!-- the plotting-table surface: panel light fading into ink -->
    <linearGradient id="surface" x1="5" y1="4" x2="59" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101b28"/>
      <stop offset=".52" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#070b13"/>
    </linearGradient>
    <!-- one schedule: patina at the head, blue at the tail -->
    <linearGradient id="schedule" x1="6" y1="6" x2="69" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45c4d8"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <!-- the fill ball: paper core dissolving into blue -->
    <radialGradient id="core">
      <stop stop-color="#f4f8ff"/>
      <stop offset=".32" stop-color="#8fc7e8"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="2" y="2" width="60" height="60" rx="17"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#surface)" stroke="#45c4d8" stroke-opacity=".2"/>
  <!-- calibration grid, our hairline in our ink -->
  <g clip-path="url(#frame)" fill="none" stroke="#45c4d8" stroke-opacity=".07" stroke-width=".65">
    <path d="M4 16H60M4 32H60M4 48H60"/>
    <path d="M16 4V60M32 4V60M48 4V60"/>
  </g>

  <g transform="translate(5.4 12.4) scale(0.72)">
    <!-- the planned path: whole, faint — what the schedule intends -->
    <path d="M 6 6 C 28 10, 38 22, 62 42" fill="none" stroke="#45c4d8" stroke-opacity=".16" stroke-width="1.3" stroke-linecap="round"/>
    <!-- the schedule, sliced: three equal arc lengths, the fill leaving at the end -->
    <g fill="none" stroke="url(#schedule)" stroke-width="4.2" stroke-linecap="round">
      <path d="M 6 6 C 10.92 6.89, 15.24 8.19, 19.25 9.88"/>
      <path d="M 26.74 13.68 C 30.52 15.93, 34.19 18.59, 38.03 21.66"/>
      <path d="M 44.49 27.02 C 47.73 29.78, 51.17 32.79, 54.98 36.06"/>
    </g>
    <!-- the fill ball -->
    <circle cx="69.07" cy="47.89" r="7" fill="url(#core)" opacity=".5" filter="url(#glow)"/>
    <circle cx="69.07" cy="47.89" r="2.9" fill="#f4f8ff" filter="url(#glow)"/>
  </g>
</svg>
